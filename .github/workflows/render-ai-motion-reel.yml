name: Render AI Motion Reel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/scenes/AIMotionReel.tsx"
      - "src/Root.tsx"
      - "scripts/generate_bgm.py"
      - "package.json"
      - ".github/workflows/render-ai-motion-reel.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: npm install
      - name: Prepare Remotion browser
        run: npx remotion browser ensure
      - name: Generate original soundtrack and render MP4
        run: npm run render:ai-reel -- --concurrency=2
      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: ai-motion-reel-mp4
          path: out/ai-motion-reel.mp4
          if-no-files-found: error
          retention-days: 7
